[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortcraft"
version = "0.1.0"
description = "Customer propensity and segmentation modeling toolkit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lifelines>=0.27",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cohortcraft = "cohortcraft.cli:main"

[tool.setuptools.packages.find]
include = ["cohortcraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
